name: Build Iraq Network Monitor APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.50.0'
          cache: true

      - name: Verify release identity
        shell: bash
        run: |
          set -euo pipefail
          grep -Eq '^version:[[:space:]]*1\\.0\\.21\\+24[[:space:]]*$' pubspec.yaml
          grep -Fq 'applicationId = "com.example.abrj_iraq"' android/app/build.gradle.kts

      - name: Accept Android licenses
        run: yes | flutter doctor --android-licenses || true

      - name: Configure Android SDK
        run: |
          echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties
          echo "sdk.dir=$ANDROID_HOME" >> android/local.properties

      - name: Install Flutter packages
        run: flutter pub get --enforce-lockfile

      - name: Check release signing secrets
        id: signing
        shell: bash
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [[ -n "$KEYSTORE" && -n "$STORE_PASSWORD" && -n "$KEY_ALIAS" && -n "$KEY_PASSWORD" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare persistent release signing key
        if: steps.signing.outputs.configured == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > android/app/upload-keystore.jks
          chmod 600 android/app/upload-keystore.jks
          python3 - <<'PY'
          import os
          def escape(value):
              value = value.replace("\\", "\\\\")
              for char in ("=", ":", "#", "!"):
                  value = value.replace(char, "\\" + char)
              return value
          values = {
              "storeFile": "upload-keystore.jks",
              "storePassword": os.environ["ANDROID_KEYSTORE_PASSWORD"],
              "keyAlias": os.environ["ANDROID_KEY_ALIAS"],
              "keyPassword": os.environ["ANDROID_KEY_PASSWORD"],
          }
          with open("android/key.properties", "w", encoding="utf-8") as f:
              for key, value in values.items():
                  f.write(f"{key}={escape(value)}" + chr(10))
          PY
          chmod 600 android/key.properties

      - name: Build signed release APK
        if: steps.signing.outputs.configured == 'true'
        run: flutter build apk --release --verbose

      - name: Verify release APK signature
        if: steps.signing.outputs.configured == 'true'
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-release.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -s "$APK"
          "$APKSIGNER" verify --verbose --print-certs "$APK"

      - name: Build debug APK for compile testing
        if: steps.signing.outputs.configured != 'true'
        run: flutter build apk --debug --verbose

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: iraq-network-monitor-${{ github.run_number }}
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Remove temporary signing material
        if: always()
        run: rm -f android/key.properties android/app/upload-keystore.jks
